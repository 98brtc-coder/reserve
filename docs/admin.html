<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 · 평가 현황</title>
<meta name="theme-color" content="#16243a">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css?v=6">
<script src="config.js?v=6"></script>
</head>
<body>
<main class="wrap wide">

  <section id="loginView" class="panel" style="max-width:420px;margin:40px auto;">
    <h2>교관 · 관리자 로그인</h2>
    <label for="pin">관리자 PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN 입력">
    <div class="row" style="margin-top:12px"><button id="loginBtn" class="block">로그인</button></div>
    <p id="loginMsg" class="msg"></p>
    <p class="msg" style="color:var(--muted)">PIN 은 구글 시트의 <b>설정</b> 탭에서 변경합니다.</p>
  </section>

  <section id="dashView" hidden>
    <div class="topbar">
      <div>
        <h1 id="dashTitle">평가 현황</h1>
        <div class="meta">갱신 <span id="updatedAt">-</span> · <span id="autoState">자동 새로고침 켜짐</span></div>
      </div>
      <div class="row">
        <button id="refreshBtn" class="ghost">새로고침</button>
        <button id="autoBtn" class="ghost">자동 새로고침 끄기</button>
        <button id="csvBtn" class="ghost">CSV 저장</button>
        <button id="logoutBtn" class="ghost">로그아웃</button>
      </div>
    </div>

    <div class="panel datebar" id="dateBar">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div>
          <div class="dkey">조회 기준일</div>
          <div class="dval" id="dateLabel">오늘</div>
        </div>
        <div class="row">
          <button id="pastBtn" class="ghost">📅 과거 현황 확인</button>
          <button id="todayBtn" hidden>오늘 현황으로</button>
        </div>
      </div>
      <div id="datePicker" hidden>
        <div class="row" style="margin-top:14px">
          <label for="dateInput" style="margin:0">날짜 선택</label>
          <input type="date" id="dateInput">
          <button id="dateGo">조회</button>
          <button id="dateAll" class="ghost">전체 기간</button>
        </div>
        <div class="quickdates" id="quickDates"></div>
        <p class="msg" style="color:var(--muted)">응답이 있는 날짜만 아래에 표시됩니다.</p>
      </div>
    </div>

    <div class="panel" id="togglePanel">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">평가 · 설문 개폐</h2>
        <div class="row">
          <button id="allOpenBtn" class="on">평가 전체 열기</button>
          <button id="allCloseBtn" class="off">평가 전체 닫기</button>
        </div>
      </div>
      <div class="switches" id="switches"></div>
      <p id="toggleMsg" class="msg"></p>
    </div>

    <div class="viewtabs">
      <button id="viewEval" class="vtab active">📝 평가 현황</button>
      <button id="viewSurvey" class="vtab">📊 설문 결과</button>
    </div>

    <!-- ── 평가 현황 ─────────────────────────────── -->
    <div id="evalView">
      <div class="panel">
        <h2>종합 순위 <span class="hint">과목별 득점률(%) 평균</span></h2>
        <div class="scroll"><table id="combinedTable"><thead></thead><tbody></tbody></table></div>
        <p id="combinedNote" class="msg" style="color:var(--muted)"></p>
      </div>

      <div class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">과목별 현황</h2>
          <div class="tabs" id="tabs"></div>
        </div>
        <div class="stats" style="margin-bottom:16px">
          <div class="stat"><div class="k">제출</div><div class="v" id="stSubmitted">-</div></div>
          <div class="stat"><div class="k">참여율</div><div class="v" id="stRate">-</div></div>
          <div class="stat"><div class="k">평균 점수</div><div class="v" id="stAvg">-</div></div>
          <div class="stat"><div class="k">1위 조</div><div class="v" id="stBest">-</div></div>
        </div>
        <p class="meta" id="subjSheet" style="margin:-8px 0 12px"></p>
        <p id="subjWarn" class="msg err" hidden></p>
        <div class="groups" id="groupCards"></div>
      </div>

      <div class="panel" id="unknownPanel" hidden>
        <h2>번호 확인 필요</h2>
        <p class="msg" style="color:var(--muted)">번호 형식이 잘못되어 조에 반영되지 않은 응답입니다.</p>
        <div class="scroll">
          <table id="unknownTable">
            <thead><tr><th>과목</th><th>입력값</th><th class="num">점수</th><th>제출시각</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── 설문 결과 ─────────────────────────────── -->
    <div id="surveyView" hidden>
      <div class="panel">
        <div class="survey-head">
          <div>
            <h2 style="margin:0" id="surveyTitle">설문 결과</h2>
            <div class="meta" id="surveyState">-</div>
          </div>
          <div class="hero">
            <div class="hero-v" id="surveyCount">-</div>
            <div class="hero-k">총 응답</div>
          </div>
        </div>
        <p class="msg" style="color:var(--muted)">
          무기명 설문입니다. 응답자를 식별할 수 있는 정보는 수집·표시되지 않습니다.
        </p>
        <div class="row" style="margin-top:6px">
          <span class="meta">객관식 표시</span>
          <div class="tabs" id="chartToggle">
            <button class="tab" data-mode="pie">원형</button>
            <button class="tab" data-mode="bar">막대</button>
          </div>
        </div>
        <p id="surveyMsg" class="msg"></p>
      </div>
      <div id="surveyQuestions"></div>
    </div>

    <p id="dashMsg" class="msg"></p>
  </section>

</main>
<script src="common.js?v=6"></script>
<script src="admin.js?v=6"></script>
</body>
</html>
