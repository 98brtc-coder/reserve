<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예비군 평가 · 설문</title>
<meta name="theme-color" content="#16243a">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="crest" aria-hidden="true">🛡️</div>
    <h1 id="unitName">예비군훈련대</h1>
    <p class="sub">평가 · 설문 시스템</p>
  </header>

  <p id="notice" class="notice" hidden></p>

  <nav class="cards">
    <a id="evalCard" class="card eval" href="#">
      <span class="card-icon" aria-hidden="true">📝</span>
      <span class="card-body">
        <span class="card-title">평가 응시</span>
        <span class="card-desc">첫 질문에 <b>본인 번호(조-번)</b>를 정확히 입력하십시오.</span>
      </span>
      <span class="pill" id="evalPill">확인 중</span>
    </a>

    <a id="surveyCard" class="card survey" href="#">
      <span class="card-icon" aria-hidden="true">📊</span>
      <span class="card-body">
        <span class="card-title">설문 참여</span>
        <span class="card-desc"><b>무기명</b>으로 진행됩니다. 솔직하게 응답해 주십시오.</span>
      </span>
      <span class="pill" id="surveyPill">확인 중</span>
    </a>
  </nav>

  <section class="guide">
    <h2>안내</h2>
    <ol>
      <li>번호는 <b>조-번</b> 형식으로 입력합니다. (예: 3조 7번 → <b>3-7</b>)</li>
      <li>평가는 1인 1회이며, 여러 번 제출한 경우 <b>마지막 제출</b>만 인정됩니다.</li>
      <li>번호를 잘못 입력하면 조 점수에 반영되지 않습니다.</li>
      <li>이 화면으로 돌아오려면 카드를 휴대폰 뒷면에 다시 태그하십시오.</li>
    </ol>
  </section>

  <footer class="foot">
    <span id="footUnit"></span>
    <a href="admin.html" class="admin-link">관리자</a>
  </footer>

</main>
<script src="common.js"></script>
<script src="landing.js"></script>
</body>
</html>
