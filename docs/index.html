<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예비군 평가 · 설문</title>
<meta name="theme-color" content="#16243a">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="config.js?v=6"></script>
<script>
/* CSS·스크립트를 기다리지 않고 상태 요청을 먼저 보낸다 (0.2~0.3초 단축) */
(function () {
  var cfg = window.UNIT_CONFIG || {};
  if (!cfg.apiUrl) return;
  try {
    var u = cfg.apiUrl + (cfg.apiUrl.indexOf('?') < 0 ? '?' : '&') + 'action=state&t=' + Date.now();
    window.__earlyState = fetch(u).then(function (r) { return r.json(); });
  } catch (e) { /* 무시 */ }
})();
</script>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="crest" aria-hidden="true">🛡️</div>
    <h1 id="unitName">예비군훈련대</h1>
    <p class="sub">평가 · 설문 시스템</p>
  </header>

  <p id="notice" class="notice" hidden></p>

  <nav class="cards" id="cards">
    <p class="empty" id="loading">불러오는 중…</p>
  </nav>
  <p class="checking" id="checking" hidden>최신 상태를 확인하고 있습니다…</p>

  <section class="guide" id="guide">
    <h2 id="guideTitle">안내</h2>
    <ol id="guideList">
      <li>번호는 <b>조-번</b> 형식으로 입력합니다. (예: 3조 7번 → <b>3-7</b>)</li>
      <li>평가는 <b>과목마다</b> 번호를 입력해야 합니다.</li>
      <li>1인 1회이며, 여러 번 제출한 경우 <b>마지막 제출</b>만 인정됩니다.</li>
      <li>번호를 잘못 입력하면 조 점수에 반영되지 않습니다.</li>
      <li>이 화면으로 돌아오려면 카드를 휴대폰 뒷면에 다시 태그하십시오.</li>
    </ol>
  </section>

  <footer class="foot">
    <span id="footUnit"></span>
    <a href="admin.html" class="admin-link">관리자</a>
  </footer>

</main>
<script src="common.js?v=6"></script>
<script src="landing.js?v=6"></script>
</body>
</html>
