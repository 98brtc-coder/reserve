<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예비군 평가 · 설문</title>
<meta name="theme-color" content="#16243a">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="config.js?v=23"></script>
<script>
/* CSS·스크립트를 기다리지 않고 상태 요청을 먼저 보낸다 */
(function () {
  var cfg = window.UNIT_CONFIG || {};
  if (!cfg.apiUrl) return;
  try {
    var u = cfg.apiUrl + (cfg.apiUrl.indexOf('?') < 0 ? '?' : '&') + 'action=state&t=' + Date.now();
    window.__earlyState = fetch(u).then(function (r) { return r.json(); });
  } catch (e) { /* 무시 */ }
})();
</script>
<link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
<main class="wrap">

  <header class="hero">
    <h1 id="unitName">예비군훈련대</h1>
    <p class="sub">평가 · 설문 시스템</p>
  </header>

  <p id="notice" class="notice" hidden></p>

  <!-- 본인 번호 선택 -->
  <section class="panel me" id="mePanel" hidden>
    <h2>본인 번호를 선택하십시오</h2>
    <p class="me-note" id="meNote" hidden></p>
    <div class="me-row">
      <label for="selG">조</label>
      <select id="selG"></select>
      <label for="selN">번</label>
      <select id="selN"></select>
      <button id="meOk">확인</button>
    </div>
    <p class="me-hint">
      등록한 번호는 <b>본인에게 고정</b>되어 다른 사람이 쓸 수 없습니다.<br>
      한 번 등록하면 본인은 바꿀 수 없으니 번호를 정확히 고르십시오.
    </p>
  </section>

  <!-- 선택된 번호 표시 -->
  <div class="mebar" id="meBar" hidden>
    <span class="mebar-no" id="meNo">-</span>
    <span class="mebar-plan" id="mePlan" hidden></span>
    <button id="meUnlock" class="ghost lockbtn" title="교관 전용 — 번호 재등록">🔒</button>
  </div>

  <nav class="cards" id="cards">
    <p class="empty" id="loading">불러오는 중…</p>
  </nav>
  <p class="checking" id="checking" hidden>최신 상태를 확인하고 있습니다…</p>

  <section class="guide" id="guide">
    <h2 id="guideTitle">안내</h2>
    <ol id="guideList">
      <li><b>1인 1회</b>만 인정됩니다. 같은 번호로 여러 번 내면 <b>처음 제출한 것</b>만 반영됩니다.</li>
      <li>이 화면으로 돌아오려면 카드를 휴대폰 뒷면에 다시 태그하십시오.</li>
    </ol>
  </section>

  <footer class="foot">
    <span id="footUnit"></span>
    <a href="admin.html" class="admin-link">관리자</a>
  </footer>

</main>
<script src="common.js?v=23"></script>
<script src="landing.js?v=23"></script>
</body>
</html>
